# Fixed project name so the container and volume don't depend on the folder name.
name: plotworks
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: plotworks
      POSTGRES_PASSWORD: plotworks
      POSTGRES_DB: plotworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
